[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mpa-evidence-workbench"
version = "0.1.0"
description = "Offline evidence workbench bundled with the MPA Research Agent Skill"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
pdf = ["pypdf>=5,<8"]

[project.scripts]
mpa-evidence = "evidence_workbench.cli:main"

[tool.setuptools.packages.find]
where = ["skills/mpa-skill/scripts"]
include = ["evidence_workbench*"]
