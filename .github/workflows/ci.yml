name: CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.13']
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install optional PDF dependency for PDF tests
        run: python -m pip install 'pypdf>=5,<8'

      - name: Run all tests (workbench, portability, package, Skill contract, docs, workspace, release)
        run: python -m unittest discover -s tests -v

      - name: Verify release metadata
        run: python tools/check_release.py

      - name: Build distributable skill ZIP
        run: python tools/package_skill.py --output dist/mpa-skill.zip

      - name: Upload installable skill package
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.python == '3.13' }}
        uses: actions/upload-artifact@v4
        with:
          name: mpa-research-agent-skill
          path: dist/mpa-skill.zip
          if-no-files-found: error

  publish-release:
    name: Publish versioned release after green CI
    needs: test
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: mpa-skill-release-main
      cancel-in-progress: false
    steps:
      - name: Check out tested main commit including tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate metadata, package Skill and generate checksum
        shell: bash
        run: |
          set -euo pipefail
          python tools/check_release.py
          python tools/package_skill.py --output dist/mpa-skill.zip
          (cd dist && sha256sum mpa-skill.zip > SHA256SUMS)

      - name: Publish tag and release only for new version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(python tools/check_release.py --print-version)"
          TAG="v$VERSION"
          NOTES="docs/releases/v$VERSION.md"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; do not overwrite published artifacts."
            exit 0
          fi
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            TAG_COMMIT="$(git rev-list -n 1 "$TAG")"
            if [ "$TAG_COMMIT" != "$GITHUB_SHA" ]; then
              echo "Tag $TAG already exists at $TAG_COMMIT, not $GITHUB_SHA." >&2
              exit 1
            fi
          fi
          gh release create "$TAG" dist/mpa-skill.zip dist/SHA256SUMS \
            --target "$GITHUB_SHA" \
            --title "v$VERSION — MPA Research Agent / 公共管理证据研究助手" \
            --notes-file "$NOTES" \
            --latest
