<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="MPA Skill logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FDF6F8"/>
      <stop offset="1" stop-color="#FAF7F8"/>
    </linearGradient>
    <linearGradient id="bookL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D65A7C"/>
      <stop offset="1" stop-color="#B8456B"/>
    </linearGradient>
    <linearGradient id="bookR" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A67C94"/>
      <stop offset="1" stop-color="#8A6580"/>
    </linearGradient>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)" stroke="#F2B5C1" stroke-width="2"/>

  <!-- 书本（打开的两页） -->
  <path d="M 116 168 C 152 192, 208 198, 256 186 L 256 320 C 208 332, 152 326, 116 302 Z" fill="url(#bookL)"/>
  <path d="M 396 168 C 360 192, 304 198, 256 186 L 256 320 C 304 332, 360 326, 396 302 Z" fill="url(#bookR)"/>
  <!-- 中缝 -->
  <line x1="256" y1="186" x2="256" y2="320" stroke="#FDF6F8" stroke-width="4" stroke-linecap="round"/>

  <!-- 字标 -->
  <text x="256" y="408" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="100" font-weight="800" fill="#3D3A42" letter-spacing="4">MPA</text>
  <text x="256" y="450" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600" fill="#9B95A3" letter-spacing="5">RESEARCH SKILL</text>
</svg>
