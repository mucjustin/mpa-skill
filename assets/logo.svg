<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="MPA Skill logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FDF6F8"/>
      <stop offset="1" stop-color="#FAF7F8"/>
    </linearGradient>
    <linearGradient id="bookL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D65A7C"/>
      <stop offset="1" stop-color="#B8456B"/>
    </linearGradient>
    <linearGradient id="bookR" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A67C94"/>
      <stop offset="1" stop-color="#8A6580"/>
    </linearGradient>
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D65A7C"/>
      <stop offset="0.5" stop-color="#E87A6A"/>
      <stop offset="1" stop-color="#D65A7C"/>
    </linearGradient>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)" stroke="#F2B5C1" stroke-width="2"/>

  <!-- 书本（打开的两页） -->
  <path d="M 116 148 C 152 172, 208 178, 256 166 L 256 300 C 208 312, 152 306, 116 282 Z" fill="url(#bookL)"/>
  <path d="M 396 148 C 360 172, 304 178, 256 166 L 256 300 C 304 312, 360 306, 396 282 Z" fill="url(#bookR)"/>
  <!-- 中缝 -->
  <line x1="256" y1="166" x2="256" y2="300" stroke="#FDF6F8" stroke-width="4" stroke-linecap="round"/>
  <!-- 书页纹理线 -->
  <line x1="138" y1="195" x2="216" y2="185" stroke="#FDF6F8" stroke-width="4" stroke-linecap="round" opacity="0.4"/>
  <line x1="130" y1="228" x2="224" y2="216" stroke="#FDF6F8" stroke-width="4" stroke-linecap="round" opacity="0.4"/>
  <line x1="296" y1="185" x2="374" y2="195" stroke="#FDF6F8" stroke-width="4" stroke-linecap="round" opacity="0.4"/>
  <line x1="288" y1="216" x2="382" y2="228" stroke="#FDF6F8" stroke-width="4" stroke-linecap="round" opacity="0.4"/>

  <!-- 研究主线弧 -->
  <path d="M 128 120 Q 200 96 256 108 Q 312 96 384 120" fill="none" stroke="url(#arc)" stroke-width="6" stroke-linecap="round"/>
  <circle cx="128" cy="120" r="6" fill="#D65A7C"/>
  <circle cx="256" cy="108" r="6" fill="#E87A6A"/>
  <circle cx="384" cy="120" r="6" fill="#D65A7C"/>

  <!-- 字标 -->
  <text x="256" y="398" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="116" font-weight="800" fill="#3D3A42" letter-spacing="6">MPA</text>
  <text x="256" y="446" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="600" fill="#9B95A3" letter-spacing="6">RESEARCH SKILL</text>
</svg>
