<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="MPA Skill thin-controller workflow diagram">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FDF6F8"/>
      <stop offset="1" stop-color="#FAF7F8"/>
    </linearGradient>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#D65A7C"/>
    </marker>
    <marker id="ag" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#E87A6A"/>
    </marker>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>

  <!-- 标题 -->
  <text x="640" y="48" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="700" fill="#3D3A42" letter-spacing="2">薄控制器工作流 · Thin-Controller Workflow</text>

  <!-- 节点 1: 输入 -->
  <rect x="40" y="90" width="200" height="88" rx="14" fill="#FFFFFF" stroke="#F2B5C1" stroke-width="1.5"/>
  <text x="140" y="128" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif" font-size="19" font-weight="700" fill="#3D3A42">用户请求与材料</text>
  <text x="140" y="154" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#9B95A3">request + attachments</text>

  <!-- 菱形 2: 范围判定 -->
  <path d="M 330 90 L 390 134 L 330 178 L 270 134 Z" fill="#D65A7C" stroke="#B8456B" stroke-width="1.5"/>
  <text x="330" y="130" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">MPA 范围</text>
  <text x="330" y="150" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">判定</text>

  <!-- 节点 3 -->
  <rect x="420" y="90" width="210" height="88" rx="14" fill="#FFFFFF" stroke="#F2B5C1" stroke-width="1.5"/>
  <text x="525" y="128" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif" font-size="19" font-weight="700" fill="#3D3A42">任务分类与排序</text>
  <text x="525" y="154" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#9B95A3">classify by dependency</text>

  <!-- 节点 4 -->
  <rect x="660" y="90" width="210" height="88" rx="14" fill="#FFFFFF" stroke="#F2B5C1" stroke-width="1.5"/>
  <text x="765" y="128" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif" font-size="19" font-weight="700" fill="#3D3A42">组合最小必要路线</text>
  <text x="765" y="154" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#9B95A3">minimum sufficient route</text>

  <!-- 节点 5: 确认 -->
  <rect x="900" y="90" width="210" height="88" rx="14" fill="#FFFFFF" stroke="#F5C896" stroke-width="2"/>
  <text x="1005" y="128" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif" font-size="19" font-weight="700" fill="#3D3A42">一次性确认</text>
  <text x="1005" y="154" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#9B95A3">是否执行？</text>

  <!-- 箭头 1→2→3→4→5 -->
  <line x1="240" y1="134" x2="266" y2="134" stroke="#D65A7C" stroke-width="4" marker-end="url(#ar)"/>
  <line x1="390" y1="134" x2="416" y2="134" stroke="#D65A7C" stroke-width="4" marker-end="url(#ar)"/>
  <line x1="630" y1="134" x2="656" y2="134" stroke="#D65A7C" stroke-width="4" marker-end="url(#ar)"/>
  <line x1="870" y1="134" x2="896" y2="134" stroke="#D65A7C" stroke-width="4" marker-end="url(#ar)"/>

  <!-- 非 MPA 分支 -->
  <line x1="330" y1="182" x2="330" y2="244" stroke="#D65A7C" stroke-width="3" stroke-dasharray="5 5" marker-end="url(#ar)"/>
  <text x="342" y="220" font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif" font-size="13" fill="#9B95A3">非 MPA 任务</text>
  <rect x="240" y="252" width="180" height="52" rx="12" fill="#FFFFFF" stroke="#F2B5C1" stroke-width="1.5"/>
  <text x="330" y="284" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif" font-size="16" fill="#3D3A42">转交其他 Skill</text>

  <!-- MPA 分支向下到执行层 -->
  <line x1="1005" y1="178" x2="1005" y2="276" stroke="#E87A6A" stroke-width="4" marker-end="url(#ag)"/>
  <text x="1017" y="236" font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif" font-size="13" fill="#9B95A3">确认后继续</text>

  <!-- 执行层卡片 -->
  <rect x="100" y="284" width="1100" height="170" rx="16" fill="#FFFFFF" stroke="#F2B5C1" stroke-width="1.5"/>
  <text x="130" y="316" font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#3D3A42">执行层 · 按依赖排序，只组合必要的路由</text>

  <!-- 十个路由标签 -->
  <g font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif" font-size="14" font-weight="600" text-anchor="middle">
    <rect x="120"  y="340" width="92" height="40" rx="20" fill="#D65A7C" fill-opacity="0.10" stroke="#D65A7C" stroke-opacity="0.45"/>
    <text x="166" y="365" fill="#D65A7C">课程资料</text>
    <rect x="222"  y="340" width="92" height="40" rx="20" fill="#D65A7C" fill-opacity="0.10" stroke="#D65A7C" stroke-opacity="0.45"/>
    <text x="268" y="365" fill="#D65A7C">案例分析</text>
    <rect x="324"  y="340" width="92" height="40" rx="20" fill="#A67C94" fill-opacity="0.10" stroke="#A67C94" stroke-opacity="0.45"/>
    <text x="370" y="365" fill="#A67C94">案例大赛</text>
    <rect x="426"  y="340" width="92" height="40" rx="20" fill="#A67C94" fill-opacity="0.10" stroke="#A67C94" stroke-opacity="0.45"/>
    <text x="472" y="365" fill="#A67C94">政策备忘录</text>
    <rect x="528"  y="340" width="92" height="40" rx="20" fill="#A67C94" fill-opacity="0.10" stroke="#A67C94" stroke-opacity="0.45"/>
    <text x="574" y="365" fill="#A67C94">文献综述</text>
    <rect x="630"  y="340" width="92" height="40" rx="20" fill="#D65A7C" fill-opacity="0.10" stroke="#D65A7C" stroke-opacity="0.45"/>
    <text x="676" y="365" fill="#D65A7C">研究设计</text>
    <rect x="732"  y="340" width="92" height="40" rx="20" fill="#D65A7C" fill-opacity="0.10" stroke="#D65A7C" stroke-opacity="0.45"/>
    <text x="778" y="365" fill="#D65A7C">田野调研</text>
    <rect x="834"  y="340" width="92" height="40" rx="20" fill="#D65A7C" fill-opacity="0.10" stroke="#D65A7C" stroke-opacity="0.45"/>
    <text x="880" y="365" fill="#D65A7C">数据分析</text>
    <rect x="936"  y="340" width="92" height="40" rx="20" fill="#A67C94" fill-opacity="0.10" stroke="#A67C94" stroke-opacity="0.45"/>
    <text x="982" y="365" fill="#A67C94">论文写作</text>
    <rect x="1038" y="340" width="92" height="40" rx="20" fill="#A67C94" fill-opacity="0.10" stroke="#A67C94" stroke-opacity="0.45"/>
    <text x="1084" y="365" fill="#A67C94">答辩准备</text>
  </g>

  <!-- 集成行 -->
  <text x="130" y="420" font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif" font-size="14" fill="#9B95A3">可选集成：</text>
  <g font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif" font-size="14" font-weight="600">
    <rect x="228" y="400" width="130" height="34" rx="17" fill="#FFFFFF" stroke="#E87A6A" stroke-opacity="0.5"/>
    <text x="293" y="423" text-anchor="middle" fill="#E87A6A">Zotero 文献库</text>
    <rect x="372" y="400" width="130" height="34" rx="17" fill="#FFFFFF" stroke="#E87A6A" stroke-opacity="0.5"/>
    <text x="437" y="423" text-anchor="middle" fill="#E87A6A">Obsidian 笔记库</text>
    <rect x="516" y="400" width="176" height="34" rx="17" fill="#FFFFFF" stroke="#E87A6A" stroke-opacity="0.5"/>
    <text x="604" y="422" text-anchor="middle" fill="#E87A6A" font-size="13">文献 / PDF / 数据 / Office</text>
  </g>
  <text x="712" y="423" font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif" font-size="13" fill="#C4BFC7">缺失时明确降级，绝不假装集成成功</text>

  <!-- 质量门 -->
  <line x1="640" y1="454" x2="640" y2="484" stroke="#E87A6A" stroke-width="4" marker-end="url(#ag)"/>
  <rect x="360" y="492" width="280" height="64" rx="14" fill="#FFFFFF" stroke="#F5C896" stroke-width="2"/>
  <text x="500" y="522" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#3D3A42">MPA 质量门 · 研究契约核验</text>
  <text x="500" y="544" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#9B95A3">research contract check</text>

  <!-- 最终验收 -->
  <line x1="640" y1="524" x2="678" y2="524" stroke="#D65A7C" stroke-width="4" marker-end="url(#ar)"/>
  <rect x="686" y="492" width="260" height="64" rx="14" fill="#FFFFFF" stroke="#F2B5C1" stroke-width="1.5"/>
  <text x="816" y="522" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#3D3A42">最终验收与状态交接</text>
  <text x="816" y="544" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#9B95A3">final acceptance</text>

  <!-- 安全停止贯穿条 -->
  <line x1="1218" y1="90" x2="1218" y2="580" stroke="#F5C896" stroke-width="3" stroke-dasharray="6 6" opacity="0.8"/>
  <rect x="1194" y="300" width="48" height="170" rx="24" fill="#FFFFFF" stroke="#F5C896" stroke-opacity="0.6"/>
  <text x="1218" y="330" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#B8456B">安</text>
  <text x="1218" y="354" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#B8456B">全</text>
  <text x="1218" y="378" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#B8456B">停</text>
  <text x="1218" y="402" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#B8456B">止</text>
  <text x="1218" y="430" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif" font-size="11" fill="#9B95A3">登录·验证码</text>
  <text x="1218" y="450" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif" font-size="11" fill="#9B95A3">付费墙·授权</text>
  <text x="1218" y="470" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif" font-size="11" fill="#9B95A3">破坏性写入·歧义</text>

  <!-- 底部 -->
  <text x="640" y="606" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif" font-size="14" fill="#9B95A3">安全停止贯穿全程：遇到登录、验证码、付费墙、授权访问、破坏性写入或实质研究歧义时暂停并询问</text>
</svg>
