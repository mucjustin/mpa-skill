<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 380" width="1280" height="380" role="img" aria-label="MPA Skill thin-controller workflow">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FDF6F8"/>
      <stop offset="1" stop-color="#FAF7F8"/>
    </linearGradient>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#D65A7C"/>
    </marker>
    <marker id="ag" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#E87A6A"/>
    </marker>
  </defs>

  <rect width="1280" height="380" fill="url(#bg)"/>

  <!-- 标题 -->
  <text x="640" y="40" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="700" fill="#3D3A42" letter-spacing="2">薄控制器工作流 · Thin-Controller Workflow</text>

  <!-- 排 1：左 → 右 -->
  <rect x="70"   y="72" width="220" height="60" rx="14" fill="#FFFFFF" stroke="#F2B5C1" stroke-width="1.5"/>
  <text x="180"  y="108" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#3D3A42">用户请求</text>

  <rect x="370"  y="72" width="220" height="60" rx="14" fill="#D65A7C"/>
  <text x="480"  y="108" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">范围判定</text>

  <rect x="670"  y="72" width="220" height="60" rx="14" fill="#FFFFFF" stroke="#F2B5C1" stroke-width="1.5"/>
  <text x="780"  y="108" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#3D3A42">任务排序</text>

  <rect x="970"  y="72" width="220" height="60" rx="14" fill="#FFFFFF" stroke="#F2B5C1" stroke-width="1.5"/>
  <text x="1080" y="108" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#3D3A42">路线组合</text>

  <!-- 排 1 箭头 -->
  <line x1="290" y1="102" x2="364" y2="102" stroke="#D65A7C" stroke-width="3" marker-end="url(#ar)"/>
  <line x1="590" y1="102" x2="664" y2="102" stroke="#D65A7C" stroke-width="3" marker-end="url(#ar)"/>
  <line x1="890" y1="102" x2="964" y2="102" stroke="#D65A7C" stroke-width="3" marker-end="url(#ar)"/>

  <!-- 非 MPA 分支 -->
  <line x1="480" y1="132" x2="480" y2="186" stroke="#D65A7C" stroke-width="2.5" stroke-dasharray="5 5" marker-end="url(#ar)"/>
  <rect x="390" y="192" width="180" height="42" rx="12" fill="#FFFFFF" stroke="#F2B5C1" stroke-width="1.5"/>
  <text x="480" y="219" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif" font-size="15" fill="#9B95A3">转交其他 Skill</text>

  <!-- 排 1 → 排 2 连接（右侧下行） -->
  <line x1="1080" y1="132" x2="1080" y2="246" stroke="#E87A6A" stroke-width="3" marker-end="url(#ag)"/>

  <!-- 排 2：右 → 左 -->
  <rect x="970"  y="252" width="220" height="60" rx="14" fill="#FFFFFF" stroke="#F5C896" stroke-width="2"/>
  <text x="1080" y="288" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#3D3A42">一次性确认</text>

  <rect x="670"  y="252" width="220" height="60" rx="14" fill="#FFFFFF" stroke="#F2B5C1" stroke-width="1.5"/>
  <text x="780"  y="288" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#3D3A42">执行路由</text>

  <rect x="370"  y="252" width="220" height="60" rx="14" fill="#FFFFFF" stroke="#F2B5C1" stroke-width="1.5"/>
  <text x="480"  y="288" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#3D3A42">质量门</text>

  <rect x="70"   y="252" width="220" height="60" rx="14" fill="#FFFFFF" stroke="#F2B5C1" stroke-width="1.5"/>
  <text x="180"  y="288" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#3D3A42">交付</text>

  <!-- 排 2 箭头（向左） -->
  <line x1="970" y1="282" x2="896" y2="282" stroke="#D65A7C" stroke-width="3" marker-end="url(#ar)"/>
  <line x1="670" y1="282" x2="596" y2="282" stroke="#D65A7C" stroke-width="3" marker-end="url(#ar)"/>
  <line x1="370" y1="282" x2="296" y2="282" stroke="#D65A7C" stroke-width="3" marker-end="url(#ar)"/>

  <!-- 底部 -->
  <text x="640" y="350" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif" font-size="14" fill="#9B95A3">安全停止：遇到登录、验证码、付费墙或歧义时暂停</text>
</svg>
